services:
  postgres:
    image: postgres:16-alpine
    container_name: mcpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcpulse
      POSTGRES_PASSWORD: mcpulse
      POSTGRES_DB: mcpulse
    ports:
      - '5432:5432'
    volumes:
      - mcpulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcpulse']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mcpulse-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mcpulse_pg_data:
